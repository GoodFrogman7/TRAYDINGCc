# The paper bot's one config file. Full reference: docs/BOT_SPEC.md, day-to-day use: docs/RUNBOOK.md.
# PAPER TRADING ONLY. The bot refuses any other mode, and refuses any key that looks like a credential.
# Limits (risk_per_trade and everything under guardian) may be tightened here, never loosened.

mode: paper              # the only accepted value
kill: false              # true = cancel orders, close positions, block entries (same as creating state/KILL)

account: {equity0: 10000, risk_per_trade: 0.005}        # per book

# The strategy that trades. null = the book stays flat. Example:
#   champion: {strategy: desk.strategies.s_name, params: {n: 96}}
champion: null

# Up to two shadow books (challenger_1, challenger_2), same shape as champion.
challengers: []

guardian:
  daily_loss_limit: 0.03       # stop for the day at -3%
  max_consec_losses: 3         # stop for the day after three losing trades in a row
  halt_sticky: false
  max_pos_mult: 1.0            # one position is at most 1x the account
  max_gross_mult: 3.0          # all positions together at most 3x the account
  max_positions: 10
  min_stop_pct: 0.002          # a stop must sit between 0.2% ...
  max_stop_pct: 0.25           # ... and 25% from the price

feed:
  window_bars: 3000            # hours of history given to the strategies (125 days)
  settle_seconds: 120          # a bar counts as closed this long after its hour ends
  extra_symbols: []            # fetched in addition to BTC, ETH and the month's top 10
  stale_feed_minutes: 90       # a feed older than this is frozen: everything is closed
  max_clock_skew_seconds: 30
  delist_after_bars: 72        # hours without a candle before a symbol counts as delisted
  max_catchup_bars: 2000       # longest outage that is replayed
